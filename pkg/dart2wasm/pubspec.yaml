  _js_interop_checks: 
    path: ../_js_interop_checks
  args: any
  build_integration: 
    path: ../build_integration
  collection: any
  front_end: 
    path: ../front_end
  kernel: 
    path: ../kernel
  vm: 
    path: ../vm
  wasm_builder: 
    path: ../wasm_builder