name: dart2cpp
description: Dart to C++ compiler and runtime library
version: 2.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.0.0

dev_dependencies:
  test: ^1.16.0

dependency_overrides:
  _fe_analyzer_shared: 
    path: ../../../pkg/_fe_analyzer_shared
  _js_interop_checks: 
    path: ../../../pkg/_js_interop_checks
  args: any
  collection: any
  build_integration: 
    path: ../../../pkg/build_integration
  front_end: 
    path: ../../../pkg/front_end
  kernel: 
    path: ../../../pkg/kernel
  vm: 
    path: ../../../pkg/vm
