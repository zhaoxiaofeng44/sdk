include: package:lints/recommended.yaml

analyzer:
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false
  errors:
    todo: ignore
    deprecated_member_use: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print: false
    - prefer_const_constructors
    - prefer_final_fields
    - unnecessary_this

